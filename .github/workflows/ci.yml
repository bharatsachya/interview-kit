name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (dependency rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Every workspace against its OWN tsconfig, whose `paths` list only the packages it may
      # import. This job is the dependency rule — a package reaching into `llm` or `pipeline`
      # fails here and nowhere else.
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No database, no model, no network — the suite runs on fakes by design.
      - run: npm test

  clean-clone:
    name: Clean clone → batch output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` rather than `npm install`, from a checkout with no node_modules — which is
      # exactly what a grader does, and the only way a file the repository is missing shows up.
      # A `.gitignore` line once hid a whole package this way: everything built locally, nothing
      # built from a clone.
      - run: npm ci

      # The frozen command, run verbatim. Renaming the script or a flag breaks no test and
      # scores zero, so the command itself is the assertion.
      - name: npm run evaluate (the command the marking runs)
        run: npm run evaluate -- --input fixtures/cases.json --output kits.json --fake-llm --fake-fetch

      # Validated with the repository's own validator, not a hand-written assertion. A second
      # opinion about the spec in a CI step is a second copy of the spec, and the first draft of
      # this one checked for a top-level `results` array that Appendix B has never had.
      - name: Output is Appendix B
        run: npm run check:output -- kits.json

      # The whole pipeline plus the Appendix A validator, on fakes. Catches what a unit test
      # cannot: the steps disagreeing with each other.
      - run: npm run smoke

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan it; a shallow clone silently scans almost nothing.
          fetch-depth: 0
      # The pre-commit hook runs this too, and `--no-verify` skips the hook. This one cannot be
      # skipped, which is the only reason it is worth running twice.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The deploy builds this image. Building it here means a new workspace package breaks a
      # pull request rather than a deployment.
      - run: docker build -t trao-interview-kit:ci .

  deploy-api:
    name: Deploy the API
    # Only after every gate. A deployment restarts the one replica, so shipping something that
    # does not typecheck costs a running generation as well as a revision.
    needs: [typecheck, test, clean-clone, secrets, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so the change detection below has something to diff against.
          fetch-depth: 2

      # A deployment is not free here, and not harmless: `--min-replicas 1 --max-replicas 1`
      # exists because a job's record and its spans live in the process running it, so rolling
      # the pod kills whatever generation is in flight. A web-only commit must not do that —
      # apps/web deploys itself on Vercel and has no business restarting Azure.
      - name: Did anything the image contains change?
        id: changed
        run: |
          if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"   # first push on a branch: nothing to compare
            exit 0
          fi
          files="$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || echo ALL)"
          if echo "$files" | grep -qE '^(apps/api/|packages/|scripts/|fixtures/|Dockerfile|\.dockerignore|package-lock\.json|package\.json|tsconfig)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in the API image changed — skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sign in to Azure
        if: steps.changed.outputs.backend == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Built here rather than by ACR Tasks, which an Azure for Students subscription refuses
      # outright — and natively on amd64, so unlike a laptop this needs no cross-compilation.
      - name: Build and push the image
        if: steps.changed.outputs.backend == 'true'
        run: |
          set -euo pipefail
          az acr login -n "${{ vars.AZ_ACR }}"
          image="${{ vars.AZ_ACR }}.azurecr.io/prep-kit-api:${GITHUB_SHA::7}"
          docker build --platform linux/amd64 -f Dockerfile -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # The image and nothing else.
      #
      # No environment variables and no secrets are sent from here, deliberately. They are set on
      # the app already, by `scripts/deploy-api.sh` from a local `.env.deploy`, and re-applying
      # them would mean a second copy of MONGODB_URI, CLERK_ISSUER and three API keys living in
      # GitHub — a wider blast radius than the deployment is worth. A new variable is a reason to
      # run the script once by hand; a code change is not.
      - name: Ship the revision
        if: steps.changed.outputs.backend == 'true'
        run: |
          set -euo pipefail
          az containerapp update \
            -n "${{ vars.AZ_APP }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" \
            --image "$IMAGE" -o none
          fqdn="$(az containerapp show -n "${{ vars.AZ_APP }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          echo "https://$fqdn" >> "$GITHUB_STEP_SUMMARY"

      # A revision that starts and then crashes is a deployment that reported success. The API
      # refuses to boot without MONGODB_URI or CLERK_ISSUER and dies on an unreachable Atlas, and
      # both of those have happened — so the job does not finish until the thing answers.
      - name: Wait for it to answer
        if: steps.changed.outputs.backend == 'true'
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show -n "${{ vars.AZ_APP }}" -g "${{ vars.AZ_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$fqdn/health" || true)"
            if [ "$code" = "200" ]; then echo "healthy after ${attempt} attempts"; exit 0; fi
            sleep 10
          done
          echo "The new revision never answered /health." >&2
          exit 1
