<!doctype html>
<html lang="en">
  <head><title>Lumen Analytics</title></head>
  <body>
    <div id="__next"></div>
    <!--
      Next.js serialises its route table into the document. There is not one anchor on this page,
      so anchor-only discovery sees nothing at all — but every route the app can render is right
      here, and a route is a link whether or not the server rendered one.
    -->
    <script id="__NEXT_DATA__" type="application/json">
      {"props":{"pageProps":{}},"page":"/","buildId":"abc123",
       "routes":["/","/product","/pricing","/company/how-we-hire","/legal/terms"],
       "assetPrefix":"/_next/static/chunks/main.js"}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"Lumen Analytics",
       "url":"https://lumen.test/","sameAs":["https://boards.greenhouse.io/lumen"]}
    </script>
  </body>
</html>
